<text x="55" y="62" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">COSMOTECH</text><text x="55" y="85" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#39d5e8">SOLUTIONS</text><text x="55" y="144" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#ff9b35">ENTREGA E GOVERNANÇA</text><text x="55" y="205" font-family="DejaVu Sans,sans-serif" font-size="48" font-weight="700" fill="#f4f8ff">Uma release. Uma GMUD. Um gate.</text><text x="55" y="246" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Integração verificada até a aprovação. Publicação de aplicação e janela real de observação</text><text x="55" y="277" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">permanecem pendentes.</text><path d="M55 974H1545" stroke="#10243b" stroke-width="2"/><text x="55" y="1009" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#a6bbd0">LABORATÓRIO PESSOAL  /  AWS • SRE • GITOPS</text><rect x="65" y="330" width="325" height="180" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><image x="83" y="350" width="50" height="50" href="data:image/svg+xml;base64,"/><text x="147" y="376" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">CI + Trivy</text><text x="87" y="420.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">Testes e scan obrigatórios.</text><text x="87" y="446.6" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">Imagem por digest.</text><rect x="85" y="462" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="98" y="485" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="455" y="330" width="325" height="180" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="477" y="376" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">GLPI Change</text><text x="477" y="420.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">Commit, digest, ambiente,</text><text x="477" y="446.6" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">planos e execução Kestra.</text><rect x="475" y="462" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="488" y="485" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="845" y="330" width="325" height="180" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="867" y="376" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Kestra</text><text x="867" y="420.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">Política protegida por</text><text x="867" y="446.6" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">criticidade e histórico.</text><rect x="865" y="462" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="878" y="485" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="1235" y="330" width="300" height="180" rx="20" fill="#10243b" stroke="#ff9b35" stroke-width="2"/><text x="1257" y="376" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Portal + SNS</text><text x="1257" y="420.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">Humano autenticado quando</text><text x="1257" y="446.6" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">exigido.</text><rect x="1255" y="462" width="100" height="32" rx="10" fill="#081525" stroke="#ff9b35" stroke-width="2"/><text x="1268" y="485" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#ff9b35">HUMANO</text><path d="M390,420 L455,420" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><path d="M780,420 L845,420" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1170,420 L1235,420" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="640" width="365" height="190" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="87" y="686" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Publisher GitOps</text><text x="87" y="730.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Autoridade GPG exclusiva e</text><text x="87" y="759.4" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">proteção contra replay.</text><rect x="85" y="782" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="98" y="805" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="500" y="640" width="325" height="190" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="522" y="686" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Argo CD</text><text x="522" y="730.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#a6bbd0">Chave exigida no destino.</text><text x="522" y="753.8" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#a6bbd0">Signatário alternativo recusado.</text><rect x="520" y="782" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="533" y="805" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="895" y="640" width="325" height="190" rx="20" fill="#10243b" stroke="#6d849c" stroke-width="2" stroke-dasharray="9 7"/><text x="917" y="686" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Validação + Review</text><text x="917" y="730.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Health e métricas. GMUD em</text><text x="917" y="759.4" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">observação por 12h.</text><rect x="915" y="782" width="129" height="32" rx="10" fill="#081525" stroke="#6d849c" stroke-width="2"/><text x="928" y="805" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#6d849c">PLANEJADO</text><rect x="1290" y="640" width="245" height="190" rx="20" fill="#10243b" stroke="#ff9b35" stroke-width="2"/><text x="1312" y="686" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Encerramento</text><text x="1312" y="730.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">Somente após 12h</text><text x="1312" y="756.6" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#a6bbd0">limpas, sem rollback.</text><rect x="1310" y="782" width="107" height="32" rx="10" fill="#081525" stroke="#ff9b35" stroke-width="2"/><text x="1323" y="805" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#ff9b35">ISOLADO</text><path d="M1385,510 L1385,575" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1385,575 L245,575" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><path d="M245,575 L245,640" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><path d="M430,735 L500,735" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><path d="M825,735 L895,735" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1220,735 L1290,735" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="900" width="371" height="32" rx="10" fill="#081525" stroke="#6d849c" stroke-width="2"/><text x="78" y="923" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#6d849c">BEDROCK OPCIONAL / DESABILITADO</text><text x="65" y="957" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a6bbd0">Agendamento Kestra persistente instalado. Lógica de encerramento/rollback testada isoladamente.</text></svg>