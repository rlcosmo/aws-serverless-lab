<text x="55" y="62" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">COSMOTECH</text><text x="55" y="85" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#39d5e8">SOLUTIONS</text><text x="55" y="144" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#ff9b35">ENTREGA CONTROLADA</text><text x="55" y="205" font-family="DejaVu Sans,sans-serif" font-size="46" font-weight="700" fill="#f4f8ff">Kestra como gate único.</text><text x="55" y="246" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Releases propostas por CI; autorização e evidências verificadas no</text><text x="55" y="277" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">servidor.</text><path d="M55 1284H1025" stroke="#10243b" stroke-width="2"/><text x="55" y="1319" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#a6bbd0">LABORATÓRIO PESSOAL  /  AWS • SRE • GITOPS</text><text x="985" y="1319" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#39d5e8">04/06</text><rect x="60" y="325" width="960" height="160" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="86" y="376" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#ff9b35">01</text><text x="158" y="376" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#f4f8ff">CI + Trivy + ECR</text><text x="158" y="422" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#a6bbd0">Testes e scan aprovados; referência por digest.</text><path d="M540,485 L540,530" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="530" width="960" height="160" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="86" y="581" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#ff9b35">02</text><text x="158" y="581" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#f4f8ff">GLPI + Kestra</text><text x="158" y="627" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#a6bbd0">GMUD única e decisão determinística.</text><path d="M540,690 L540,735" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="735" width="960" height="160" rx="20" fill="#10243b" stroke="#ff9b35" stroke-width="2"/><text x="86" y="786" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#ff9b35">03</text><text x="158" y="786" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#f4f8ff">Portal humano + SNS</text><text x="158" y="832" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#a6bbd0">Aprovação vinculada à release quando exigida.</text><path d="M540,895 L540,940" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="940" width="960" height="160" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="86" y="991" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#ff9b35">04</text><text x="158" y="991" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#f4f8ff">GitOps + Argo CD</text><text x="158" y="1037" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#a6bbd0">Publisher assinado; outra chave recusada no</text><text x="158" y="1071" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#a6bbd0">destino.</text><rect x="60" y="1195" width="404" height="32" rx="10" fill="#081525" stroke="#ff9b35" stroke-width="2"/><text x="73" y="1218" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#ff9b35">DEPLOY DE APLICAÇÃO AINDA PENDENTE</text></svg>