ont-weight="700" fill="#f4f8ff">Cards e timeline em português</text><text x="82" y="640.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">CI, Trivy, criticidade, planos e decisões com timestamps.</text><rect x="80" y="682" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="93" y="705" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="60" y="760" width="960" height="180" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="82" y="806" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Detalhes sob demanda</text><text x="82" y="850.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Commit e digests expansíveis, com opção de copiar.</text><rect x="80" y="892" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="93" y="915" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="60" y="970" width="960" height="180" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="82" y="1016" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Ações conforme o estado</text><text x="82" y="1060.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Humano pendente: aprovar/rejeitar. Rollback: somente elegível e dentro do prazo.</text><rect x="80" y="1102" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="93" y="1125" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="65" y="1210" width="503" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="78" y="1233" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">AUTENTICAÇÃO • CSRF • AUDITORIA PRESERVADOS</