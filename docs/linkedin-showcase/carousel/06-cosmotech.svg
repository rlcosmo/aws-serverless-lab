<text x="55" y="62" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">COSMOTECH</text><text x="55" y="85" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#39d5e8">SOLUTIONS</text><text x="55" y="144" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#ff9b35">AUDITORIA E SRE</text><text x="55" y="205" font-family="DejaVu Sans,sans-serif" font-size="46" font-weight="700" fill="#f4f8ff">Resultados que deixam provas.</text><text x="55" y="246" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Nenhuma simulação é apresentada como integração concluída.</text><path d="M55 1284H1025" stroke="#10243b" stroke-width="2"/><text x="55" y="1319" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#a6bbd0">LABORATÓRIO PESSOAL  /  AWS • SRE • GITOPS</text><text x="985" y="1319" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#39d5e8">06/06</text><text x="65" y="330" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ff9b35">SEGURANÇA</text><text x="65" y="372" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#f4f8ff">Trivy bloqueou imagens; pacotes corrigidos e CIs aprovados.</text><text x="65" y="510" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ff9b35">GITOPS</text><text x="65" y="552" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#f4f8ff">Argo recusou signatário alternativo, sem sync da aplicação</text><text x="65" y="592" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#f4f8ff">de teste.</text><text x="65" y="690" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ff9b35">OBSERVABILIDADE</text><text x="65" y="732" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#f4f8ff">Endpoints oficiais EKS conectados; alertas preservados e</text><text x="65" y="772" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#f4f8ff">targets up.</text><text x="65" y="870" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#ff9b35">JANELA DE 12H</text><text x="65" y="912" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#f4f8ff">Agendamento persistente ativo; janela real ainda não</text><text x="65" y="952" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="400" fill="#f4f8ff">iniciada.</text><rect x="60" y="1080" width="960" height="125" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><text x="85" y="1127" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Arquitetura • Automação • Engenharia de confiabilidade</text><text x="85" y="1170" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Experiência prática em AWS, com limites e evidências documentados.</text></svg>