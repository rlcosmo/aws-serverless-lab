<text x="55" y="62" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">COSMOTECH</text><text x="55" y="85" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#39d5e8">SOLUTIONS</text><text x="55" y="144" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#ff9b35">CANARY WORKER</text><text x="55" y="205" font-family="DejaVu Sans,sans-serif" font-size="46" font-weight="700" fill="#f4f8ff">Medir antes de avançar.</text><text x="55" y="246" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Estratégia preparada para consumidores SQS. Não é roteamento HTTP.</text><path d="M55 1284H1025" stroke="#10243b" stroke-width="2"/><text x="55" y="1319" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#a6bbd0">LABORATÓRIO PESSOAL  /  AWS • SRE • GITOPS</text><text x="985" y="1319" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#39d5e8">05/06</text><rect x="60" y="325" width="960" height="170" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><image x="78" y="345" width="50" height="50" href="data:image/svg+xml;base64,"/><text x="142" y="371" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Fila SQS compartilhada</text><text x="82" y="415.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Distribuição efetiva depende dos consumidores e é medida.</text><rect x="80" y="447" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="93" y="470" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><path d="M300,495 L300,575" fill="none" stroke="#39d5e8" stroke-width="3" marker-end="url(#arrow)"/><path d="M780,495 L780,575" fill="none" stroke="#39d5e8" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/><rect x="60" y="575" width="450" height="220" rx="20" fill="#10243b" stroke="#39d5e8" stroke-width="2"/><image x="78" y="595" width="50" height="50" href="data:image/svg+xml;base64,"/><text x="142" y="621" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Stable</text><text x="82" y="665.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Versão atual preservada.</text><rect x="80" y="747" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="93" y="770" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="570" y="575" width="450" height="220" rx="20" fill="#10243b" stroke="#6d849c" stroke-width="2" stroke-dasharray="9 7"/><image x="588" y="595" width="50" height="50" href="data:image/svg+xml;base64,"/><text x="652" y="621" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Canary 1 → 2</text><text x="592" y="665.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Lease e consumo controlado.</text><rect x="590" y="747" width="129" height="32" rx="10" fill="#081525" stroke="#6d849c" stroke-width="2"/><text x="603" y="770" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#6d849c">PLANEJADO</text><rect x="60" y="880" width="960" height="280" rx="20" fill="#10243b" stroke="#ff9b35" stroke-width="2" stroke-dasharray="9 7"/><text x="85" y="929" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="700" fill="#f4f8ff">Métricas → progressão ou drenagem</text><text x="85" y="982" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#a6bbd0">p95, amostras por versão, falhas, retries e DLQ. Antes de</text><text x="85" y="1024" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400" fill="#a6bbd0">retirar a candidata: inflight igual a zero.</text><rect x="85" y="1095" width="426" height="32" rx="10" fill="#081525" stroke="#ff9b35" stroke-width="2"/><text x="98" y="1118" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#ff9b35">TESTES ISOLADOS / EKS AINDA PENDENTE</text></svg>