ont-size="21" font-weight="400" fill="#a6bbd0">Worker 1.0.4. Etapa real registrada; progressão exige amostras, p95, erros, fila e DLQ.</text><rect x="80" y="772" width="100" height="32" rx="10" fill="#081525" stroke="#39d5e8" stroke-width="2"/><text x="93" y="795" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#39d5e8">ATIVO</text><rect x="60" y="895" width="960" height="200" rx="20" fill="#10243b" stroke="#ff9b35" stroke-width="2"/><text x="82" y="941" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">Limites explícitos</text><text x="82" y="985.0" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#a6bbd0">Solicitação humana de rollback e encerramento real12h ainda pendentes.</text><rect x="80" y="1047" width="107" height="32" rx="10" fill="#081525" stroke="#ff9b35" stroke-width="2"/><text x="93" y="1070" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#ff9b35">ISOLADO</text><text x="65" y="1190" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a6bbd0">Métricas ausentes bloqueiam. Nenhum valor vazio é apresentado como zero.</text></svg>