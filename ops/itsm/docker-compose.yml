name: cosmotech-itsm

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  glpi-db:
    image: mariadb@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:?GLPI_DB_ROOT_PASSWORD is required}
    volumes:
      - glpi_db:/var/lib/mysql
    networks:
      - glpi_backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging

  glpi:
    image: glpi/glpi@sha256:f1a08a72afa579393e8bda76edbe9adad00591b5a2228d7953cadc7f04e221be
    restart: unless-stopped
    environment:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD is required}
      GLPI_SKIP_AUTOUPDATE: "true"
    volumes:
      - glpi_data:/var/glpi
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - glpi_backend
      - itsm_apps
    depends_on:
      glpi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    mem_limit: 1g
    logging: *default-logging

  kestra-db:
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?KESTRA_DB_PASSWORD is required}
    volumes:
      - kestra_db:/var/lib/postgresql/data
    networks:
      - kestra_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging

  kestra:
    image: kestra/kestra@sha256:ad7602269219ab969e8194a6000e139ad5d5e153556435afb8d2a35a19993ccd
    restart: unless-stopped
    command: ["server", "standalone", "--worker-thread=8", "--config", "/etc/kestra/application.yaml"]
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required}"
    environment:
      JAVA_OPTS: "-Xms1g -Xmx4g"
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/cosmotech/itsm/tmp:/tmp/kestra-wd
      - /opt/cosmotech/itsm/application.yaml:/etc/kestra/application.yaml:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - kestra_backend
      - itsm_apps
    depends_on:
      kestra-db:
        condition: service_healthy
    mem_limit: 5g
    logging: *default-logging

volumes:
  glpi_db:
    name: cosmotech-glpi-db
  glpi_data:
    name: cosmotech-glpi-data
  kestra_db:
    name: cosmotech-kestra-db
  kestra_data:
    name: cosmotech-kestra-data

networks:
  glpi_backend:
    name: cosmotech-glpi-backend
    internal: true
  kestra_backend:
    name: cosmotech-kestra-backend
    internal: true
  itsm_apps:
    name: cosmotech-itsm-apps
