id: cosmotech_gmud_dev
namespace: cosmotech.automation
description: Fetch and validate a GLPI GMUD, dispatch protected Actions, and record real results.
# Enable only after independent Kestra service authentication and the GitHub App
# have been configured and tested. No personal Basic Auth credential is reused.
disabled: true
inputs:
  - id: change_id
    type: INT
    required: true
  - id: commit_sha
    type: STRING
    required: true
tasks:
  - id: source_and_bridge
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: source
        type: io.kestra.plugin.git.Clone
        url: https://github.com/rlcosmo/aws-serverless-lab
        branch: main
      - id: bridge
        type: io.kestra.plugin.scripts.python.Commands
        containerImage: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: host
          cpu:
            cpus: "0.5"
          memory:
            memory: 512MB
        env:
          AWS_REGION: us-east-1
          GMUD_CHANGE_ID: "{{ inputs.change_id }}"
          GMUD_COMMIT_SHA: "{{ inputs.commit_sha }}"
        beforeCommands:
          - python -m pip install --no-cache-dir -r requirements-automation.txt > /dev/null
        commands:
          - python scripts/run_gmud_bridge.py
