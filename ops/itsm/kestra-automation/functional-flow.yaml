id: cosmotech_private_functional_test
namespace: cosmotech.automation
labels:
  purpose: isolated-lab-test
concurrency:
  limit: 1
  behavior: QUEUE
tasks:
  - id: evidence_marker
    type: io.kestra.plugin.core.log.Log
    message: COSMOTECH LAB TEST - dedicated technical execution
  - id: glpi_technical_integration
    type: io.kestra.plugin.scripts.python.Commands
    pythonVersion: "3.12"
    containerImage: cosmotech-automation-runner:lab-20261104
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
      cpu:
        cpus: '0.5'
      memory:
        memory: 512MB
    env:
      AWS_DEFAULT_REGION: us-east-1
      KESTRA_EXECUTION_ID: '{{ execution.id }}'
    commands:
      - python /app/scripts/test_kestra_glpi.py
