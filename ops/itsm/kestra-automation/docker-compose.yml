name: cosmotech-automation
services:
  database:
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra_automation
      POSTGRES_USER: kestra_automation
      POSTGRES_PASSWORD: ${AUTOMATION_DB_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kestra_automation -d kestra_automation']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: local
      options: {max-size: 10m, max-file: '3'}
  storage-init:
    image: busybox@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
    user: '0:0'
    command: [sh, -c, 'chown 1000:1000 /data']
    volumes: [storage:/data]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ['no-new-privileges:true']
    logging: *logging
  engine:
    image: kestra/kestra@sha256:ad7602269219ab969e8194a6000e139ad5d5e153556435afb8d2a35a19993ccd
    command: [server, standalone, --worker-thread=2, --config, /etc/kestra/application.yaml]
    restart: unless-stopped
    env_file: /opt/cosmotech/secrets/automation/kestra-oss/runtime.env
    environment:
      JAVA_OPTS: '-Xms256m -Xmx768m'
    group_add: ['${DOCKER_GID:?required}']
    volumes:
      - storage:/app/storage
      - /opt/cosmotech/itsm-automation/application.yaml:/etc/kestra/application.yaml:ro
      - /opt/cosmotech/itsm-automation/tmp:/tmp/kestra-wd
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ['127.0.0.1:8082:8080']
    networks: [backend, apps]
    depends_on:
      database: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    mem_limit: 1536m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'test "$$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8080/api/v1/main/flows/search)" = 401']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: *logging
volumes:
  database: {name: cosmotech-automation-postgres}
  storage: {name: cosmotech-automation-kestra-storage}
networks:
  backend:
    name: cosmotech-automation-backend
    internal: true
  apps:
    name: cosmotech-automation-egress
