datasources:
  postgres:
    url: jdbc:postgresql://database:5432/kestra_automation
    driver-class-name: org.postgresql.Driver
    username: kestra_automation
    password: ${AUTOMATION_DB_PASSWORD}
kestra:
  encryption:
    secret-key: ${AUTOMATION_ENCRYPTION_KEY}
  repository:
    type: postgres
  queue:
    type: postgres
  storage:
    type: local
    local:
      base-path: /app/storage
  server:
    basic-auth:
      username: ${AUTOMATION_USERNAME}
      password: ${AUTOMATION_PASSWORD}
    url: http://127.0.0.1:8082/
  security:
    instance-owner:
      username: ${AUTOMATION_USERNAME}
      password: ${AUTOMATION_PASSWORD}
  tasks:
    tmp-dir:
      path: /tmp/kestra-wd/tmp
