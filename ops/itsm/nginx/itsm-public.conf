log_format cosmotech_safe '$remote_addr [$time_local] $request_method $host $server_protocol '
                          '$status $body_bytes_sent $request_time';

map $http_x_forwarded_proto $cosmotech_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $cosmotech_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8088 default_server;
    server_name _;

    access_log /var/log/nginx/itsm-access.log cosmotech_safe;
    error_log /var/log/nginx/itsm-error.log warn;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 8088;
    server_name glpi.cosmotechsolutions.com.br;

    access_log /var/log/nginx/itsm-access.log cosmotech_safe;
    error_log /var/log/nginx/itsm-error.log warn;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $cosmotech_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 8088;
    server_name kestra.cosmotechsolutions.com.br;

    access_log /var/log/nginx/itsm-access.log cosmotech_safe;
    error_log /var/log/nginx/itsm-error.log warn;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $cosmotech_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cosmotech_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
