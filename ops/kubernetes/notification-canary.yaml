apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cosmotech-notification-canary
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: cosmotech-controlled-notifications
      rules:
        - alert: CosmoTechNotificationCanary
          # Disabled normally. Set to vector(1) == 1 only for a controlled test,
          # then reapply this file to resolve it. Never change real alert states.
          expr: vector(0) > 0
          for: 0m
          labels:
            severity: warning
            namespace: cosmotech-lab-canary
            purpose: controlled-notification-test
          annotations:
            summary: CosmoTech controlled alert delivery test
            description: No workload failure; verify email and the resolved notification.
