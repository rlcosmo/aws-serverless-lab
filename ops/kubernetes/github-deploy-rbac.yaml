apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cosmotech-dev-image-deployer
  namespace: orders-api
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: [orders-api, "orders-api:80"]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [orders-api]
    verbs: [get, watch, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cosmotech-dev-image-deployer
  namespace: orders-api
subjects:
  - kind: Group
    name: cosmotech-dev-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cosmotech-dev-image-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cosmotech-dev-image-deployer
  namespace: orders-worker
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [orders-worker]
    verbs: [get, watch, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cosmotech-dev-image-deployer
  namespace: orders-worker
subjects:
  - kind: Group
    name: cosmotech-dev-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cosmotech-dev-image-deployer
  apiGroup: rbac.authorization.k8s.io
