# Refresh this named grant after an explicitly reviewed replacement of Tempo's PV.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cosmotech-tempo-backup-volume-reader
rules:
  - apiGroups: ['']
    resources: [persistentvolumes]
    resourceNames: [pvc-418ecba8-550c-46cc-9180-d204ca98106e]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cosmotech-tempo-backup-volume-reader
subjects:
  - kind: Group
    name: cosmotech-tempo-backup
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cosmotech-tempo-backup-volume-reader
  apiGroup: rbac.authorization.k8s.io
