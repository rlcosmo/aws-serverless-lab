apiVersion: v1
kind: Service
metadata:
  name: itsm-public-proxy
  namespace: istio-system
spec:
  ports:
    - name: http
      port: 8088
      protocol: TCP
      targetPort: 8088
  type: ClusterIP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: itsm-public-proxy-1
  namespace: istio-system
  labels:
    kubernetes.io/service-name: itsm-public-proxy
    endpointslice.kubernetes.io/managed-by: cosmotech-infrastructure
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8088
endpoints:
  - addresses:
      - 10.20.11.150
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itsm-public
  namespace: istio-system
  annotations:
    alb.ingress.kubernetes.io/group.name: observability
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: glpi.cosmotechsolutions.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: itsm-public-proxy
                port:
                  number: 8088
    - host: kestra.cosmotechsolutions.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: itsm-public-proxy
                port:
                  number: 8088
