apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cosmotech-maintenance-reader
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, persistentvolumes, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cosmotech-maintenance-reader
subjects:
  - kind: Group
    name: cosmotech-maintenance-readers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cosmotech-maintenance-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cosmotech-tempo-backup-quiesce
  namespace: observability
rules:
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    resourceNames: [tempo]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cosmotech-tempo-backup-quiesce
  namespace: observability
subjects:
  - kind: Group
    name: cosmotech-maintenance-readers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cosmotech-tempo-backup-quiesce
  apiGroup: rbac.authorization.k8s.io
