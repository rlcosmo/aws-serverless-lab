apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orders-worker
  name: orders-worker
  namespace: orders-worker
spec:
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: orders-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/lab: enabled
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 250m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 256Mi
      labels:
        app: orders-worker
    spec:
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: orders-worker
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=dev,service.namespace=orders
        envFrom:
        - configMapRef:
            name: orders-config
        image: 414053644145.dkr.ecr.us-east-1.amazonaws.com/aws-eks-istio-lab-dev-orders-worker:otel-20261103-014209
        imagePullPolicy: IfNotPresent
        name: orders-worker
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /otel
          name: otel-java-agent
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: orders-worker-sa
      serviceAccountName: orders-worker-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: otel-java-agent
