name: validate

on:
  pull_request:
  push:
    branches: [main]
    paths: [src/**, tests/**, scripts/**, requirements*.txt, .github/workflows/validate.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ruff==0.17.3
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - run: python scripts/build_lambda_artifacts.py
      - run: python scripts/validate_lambda_artifacts.py
