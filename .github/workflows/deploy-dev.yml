name: deploy-dev
run-name: "DEV ${{ inputs.mode }} GMUD ${{ inputs.change_id }} [${{ inputs.request_nonce }}]"

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [approval-probe, deploy]
        default: approval-probe
        required: true
      change_id:
        type: string
        required: false
      request_nonce:
        type: string
        required: false
      attestation:
        description: Signed metadata from the trusted GLPI/Kestra bridge; never credentials
        type: string
        required: false

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: cosmotech-dev-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt ruff==0.17.3
      - run: ruff check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/build_lambda_artifacts.py && python scripts/validate_lambda_artifacts.py
      - name: Verify real environment protection settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_deployment_gates.py
      - name: Require the trusted change bridge for an application deployment
        if: inputs.mode == 'deploy'
        env:
          BRIDGE_READY: ${{ vars.GMUD_INTEGRATION_READY }}
          GMUD_ATTESTATION: ${{ inputs.attestation }}
          GMUD_CHANGE_ID: ${{ inputs.change_id }}
          GMUD_REQUEST_NONCE: ${{ inputs.request_nonce }}
          GMUD_SIGNING_KEY: ${{ secrets.GMUD_SIGNING_KEY }}
        run: |
          test "$BRIDGE_READY" = true || { echo 'GLPI/Kestra integration is not enabled'; exit 1; }
          python scripts/verify_change_attestation.py
  dev:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo 'DEV review completed through the protected GitHub environment.'
  qa:
    needs: dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - run: echo 'QA review completed through the protected GitHub environment.'
  po-pm:
    needs: qa
    runs-on: ubuntu-latest
    environment: po-pm
    steps:
      - run: echo 'PO/PM review completed through the protected GitHub environment.'
  deploy:
    needs: po-pm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: infra-sre
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read back the real approval history for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_deployment_gates.py --verify-run-reviews
      - name: Recheck maintenance window and exact commit after approvals
        if: inputs.mode == 'deploy'
        env:
          GMUD_ATTESTATION: ${{ inputs.attestation }}
          GMUD_CHANGE_ID: ${{ inputs.change_id }}
          GMUD_REQUEST_NONCE: ${{ inputs.request_nonce }}
          GMUD_SIGNING_KEY: ${{ secrets.GMUD_SIGNING_KEY }}
        run: python scripts/verify_change_attestation.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::414053644145:role/cosmotech-serverless-lab-github-dev-deploy
          aws-region: us-east-1
          role-session-name: github-dev-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Prepare the official AWS Session Manager client
        run: |
          if ! command -v session-manager-plugin >/dev/null; then
            curl --fail --silent --show-error --location --proto '=https' \
              https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
              --output "$RUNNER_TEMP/session-manager-plugin.deb"
            sha256sum "$RUNNER_TEMP/session-manager-plugin.deb"
            sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"
          fi
      - name: Verify private connectivity or deploy the approved DEV change
        env:
          DEPLOY_MODE: ${{ inputs.mode }}
        run: bash scripts/deploy_eks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: |
            approval-evidence.json
            change-evidence.json
            deploy-evidence.json
          retention-days: 14
