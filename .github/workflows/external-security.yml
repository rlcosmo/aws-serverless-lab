name: external-security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public endpoints from outside the administrator network
        run: python scripts/external_security_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-security-evidence
          path: external-security-evidence.json
          retention-days: 14
